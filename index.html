<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>でっぱりマッチ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25313d;
      --muted: #62717f;
      --panel: rgba(255, 255, 255, 0.82);
      --line: rgba(37, 49, 61, 0.16);
      --accent: #0e8f8f;
      --accent-strong: #087171;
      --danger: #d25b52;
      --gold: #e5aa26;
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 232, 143, 0.52), transparent 24%),
        radial-gradient(circle at 83% 12%, rgba(107, 196, 166, 0.34), transparent 26%),
        linear-gradient(160deg, #f8f3e7 0%, #d9e9df 48%, #c9dce4 100%);
      color: var(--ink);
      touch-action: none;
      user-select: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .game-shell {
      position: relative;
      width: min(calc(100vw - 28px), 860px);
      height: min(calc(100vh - 28px), 640px);
      min-height: min(520px, calc(100vh - 28px));
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.25) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.22));
      background-size: 42px 42px, 42px 42px, 100% 100%;
      box-shadow: 0 22px 70px rgba(31, 55, 58, 0.22);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill,
    .button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(42, 67, 66, 0.1);
      backdrop-filter: blur(16px);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      color: var(--accent-strong);
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.94);
      transform: translateY(-1px);
    }

    .message {
      position: absolute;
      left: 50%;
      top: 74px;
      width: min(86%, 430px);
      transform: translateX(-50%);
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 18px 60px rgba(40, 67, 70, 0.2);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .message h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 6vw, 42px);
      letter-spacing: 0;
      line-height: 1.02;
    }

    .message p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .result-meta {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: -5px 0 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .start {
      min-width: 150px;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(14, 143, 143, 0.24);
    }

    .secondary {
      min-width: 124px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--accent-strong);
      font: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .start:hover {
      background: var(--accent-strong);
    }

    .difficulty {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: 0 auto 16px;
      max-width: 320px;
    }

    .difficulty button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .difficulty button.selected {
      border-color: rgba(14, 143, 143, 0.45);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(14, 143, 143, 0.2);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 720px) {
      .app {
        padding: 0;
      }

      .game-shell {
        width: 100%;
        height: 100%;
        min-height: 100%;
        border-radius: 0;
      }

      .hud {
        top: max(9px, env(safe-area-inset-top));
        left: 9px;
        right: 9px;
        align-items: flex-start;
      }

      .stats {
        max-width: calc(100% - 96px);
      }

      .pill {
        min-height: 32px;
        padding: 6px 9px;
        font-size: 13px;
      }

      .message {
        top: calc(max(9px, env(safe-area-inset-top)) + 56px);
        width: min(92%, 380px);
        padding: 16px;
      }

      .message p {
        font-size: 13px;
        line-height: 1.5;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="game-shell" aria-label="でっぱりマッチ">
      <canvas id="game" aria-label="ゲーム画面"></canvas>
      <div class="hud">
        <div class="stats">
          <div class="pill"><span>Score</span><strong id="score">0</strong></div>
          <div class="pill"><span>Wall</span><strong id="chain">0%</strong></div>
          <div class="pill"><span>Level</span><strong id="level">1</strong></div>
        </div>
        <div class="controls">
          <button class="button" id="pause" title="一時停止" aria-label="一時停止">Ⅱ</button>
          <button class="button" id="restart" title="やり直し" aria-label="やり直し">↻</button>
        </div>
      </div>
      <div class="message" id="message">
        <h1>BLOCKADE</h1>
        <p>左右どちらかのラック（棚）に図形を置いて防御ラインのベースを作ります。次に出っ張り数が1つ多い図形を順につなげていき、反対側まで届いて防御ラインが完成するとクリアです</p>
        <div class="difficulty" aria-label="難易度">
          <button type="button" data-difficulty="easy">EASY</button>
          <button type="button" data-difficulty="normal" class="selected">NORMAL</button>
          <button type="button" data-difficulty="hard">HARD</button>
        </div>
        <div class="result-meta hidden" id="resultMeta"></div>
        <div class="message-actions">
          <button class="start" id="start">スタート</button>
          <button class="secondary hidden" id="sameRetry">同じ難易度で再挑戦</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const shell = document.querySelector(".game-shell");
    const scoreEl = document.querySelector("#score");
    const chainEl = document.querySelector("#chain");
    const levelEl = document.querySelector("#level");
    const message = document.querySelector("#message");
    const resultMeta = document.querySelector("#resultMeta");
    const startButton = document.querySelector("#start");
    const sameRetryButton = document.querySelector("#sameRetry");
    const pauseButton = document.querySelector("#pause");
    const restartButton = document.querySelector("#restart");
    const difficultyButtons = document.querySelectorAll("[data-difficulty]");

    const colors = {
      3: ["#f06a59", "#9a3029"],
      4: ["#e6a92e", "#8c6110"],
      5: ["#4eb37b", "#1d6b43"],
      6: ["#2f9fc6", "#165d78"],
      7: ["#7272c8", "#35356f"],
      8: ["#c66fb5", "#763267"],
      9: ["#8fb640", "#506f1c"],
      10: ["#dd7f42", "#87451e"]
    };

    const difficultySettings = {
      easy: {
        label: "EASY",
        initialLevel: 1,
        fixedLevel: 1,
        spawnEvery: 1320,
        doubleLevel: Infinity,
        doubleChance: 0
      },
      normal: {
        label: "NORMAL",
        initialLevel: 1,
        fixedLevel: null,
        spawnEvery: 980,
        doubleLevel: 7,
        doubleChance: 0.28
      },
      hard: {
        label: "HARD",
        initialLevel: 7,
        fixedLevel: null,
        spawnEvery: 980,
        doubleLevel: 7,
        doubleChance: 0.34
      }
    };

    const introTitle = "BLOCKADE";
    const introText = "左右どちらかのラック（棚）に図形を置いて防御ラインのベースを作ります。次に出っ張り数が1つ多い図形を順につなげていき、反対側まで届いて防御ラインが完成するとクリアです";

    const state = {
      width: 0,
      height: 0,
      ratio: 1,
      demoPieces: [],
      demoSpawnTimer: 0,
      pieces: [],
      wallPieces: [],
      particles: [],
      dragging: null,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastTime: 0,
      spawnTimer: 0,
      spawnEvery: 1180,
      survivalTime: 0,
      score: 0,
      chain: 0,
      chainTimer: 0,
      difficulty: "normal",
      level: 1,
      running: false,
      paused: false,
      gameOver: false,
      cleared: false,
      clearPulse: 0,
      flash: 0
    };

    function resize() {
      const rect = shell.getBoundingClientRect();
      state.ratio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      state.width = rect.width;
      state.height = rect.height;
      canvas.width = Math.floor(rect.width * state.ratio);
      canvas.height = Math.floor(rect.height * state.ratio);
      ctx.setTransform(state.ratio, 0, 0, state.ratio, 0, 0);
    }

    let audioContext = null;
    let audioUnlocked = false;

    function ensureAudio() {
      if (audioContext) return audioContext;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      audioContext = new AudioContextClass();
      return audioContext;
    }

    function playTone(frequency, duration = 0.12, type = "sine", volume = 0.05, delay = 0) {
      const audio = ensureAudio();
      if (!audio) return;
      if (audio.state === "suspended") {
        audio.resume();
      }
      const start = audio.currentTime + delay + (audio.state === "suspended" ? 0.06 : 0);
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      const audio = ensureAudio();
      if (!audio) return;
      audioUnlocked = true;
      audio.resume().catch(() => {});
      playTone(1, 0.025, "sine", 0.0001);
    }

    function playSound(name) {
      if (name === "attach") {
        playTone(520, 0.09, "triangle", 0.045);
        playTone(780, 0.11, "triangle", 0.035, 0.05);
      } else if (name === "pop") {
        playTone(210, 0.08, "square", 0.03);
        playTone(140, 0.1, "sawtooth", 0.022, 0.035);
      } else if (name === "break") {
        playTone(150, 0.14, "sawtooth", 0.045);
        playTone(90, 0.18, "square", 0.03, 0.06);
      } else if (name === "clear") {
        playTone(440, 0.12, "triangle", 0.045);
        playTone(660, 0.14, "triangle", 0.045, 0.09);
        playTone(880, 0.18, "triangle", 0.05, 0.2);
      } else if (name === "gameover") {
        playTone(260, 0.16, "triangle", 0.04);
        playTone(180, 0.22, "triangle", 0.035, 0.13);
      } else if (name === "start") {
        playTone(380, 0.08, "triangle", 0.035);
      }
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pieceRadius(lobes) {
      const scale = state.width <= 720 ? 0.9 : 0.96;
      return Math.max(20, Math.min(34, 21 + lobes * 1.18) * scale);
    }

    function touchDistance(a, b) {
      return (a.radius + b.radius) * 0.86;
    }

    function createPiece(x = null, y = null) {
      const lobes = randomInt(3, 10);
      const radius = pieceRadius(lobes);
      return {
        id: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        x: x ?? randomInt(radius + 12, Math.max(radius + 12, state.width - radius - 12)),
        y: y ?? -radius - randomInt(0, 160),
        vx: randomInt(-12, 12),
        vy: 42 + state.level * 8 + randomInt(0, 16),
        radius,
        lobes,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.65,
        wobble: Math.random() * Math.PI * 2,
        matched: false,
        pop: 0,
        supported: false,
        supportedTime: 0,
        isWall: false,
        wallAnchor: false,
        wallDirection: 0
      };
    }

    function createDemoPiece(x = null, y = null) {
      const piece = createPiece(x, y);
      piece.x = x ?? randomInt(piece.radius + 12, Math.max(piece.radius + 12, state.width - piece.radius - 12));
      piece.y = y ?? -piece.radius - randomInt(0, 90);
      piece.vx = randomInt(-10, 10);
      piece.vy = randomInt(42, 68);
      piece.spin = (Math.random() - 0.5) * 0.42;
      piece.demo = true;
      return piece;
    }

    function dangerLineY() {
      const ratio = state.width <= 720 ? 0.58 : 0.62;
      return Math.max(160, state.height * ratio);
    }

    function floorY() {
      return state.height - 18;
    }

    function wallY() {
      return dangerLineY() - 34;
    }

    function nextLobes(lobes) {
      return lobes >= 10 ? 3 : lobes + 1;
    }

    function shelfTarget(side, piece) {
      const padding = 26;
      return {
        x: side === "left" ? padding + piece.radius : state.width - padding - piece.radius,
        y: wallY(),
        direction: side === "left" ? 1 : -1
      };
    }

    function wallProgress() {
      if (!state.wallPieces.length) return 0;
      const first = state.wallPieces[0];
      const last = state.wallPieces[state.wallPieces.length - 1];
      const side = first.wallDirection > 0 ? "right" : "left";
      const end = shelfTarget(side, last);
      const span = Math.max(1, Math.abs(end.x - first.x));
      const progress = Math.max(0, Math.min(1, Math.abs(last.x - first.x) / span));
      return state.cleared ? progress : Math.min(0.99, progress);
    }

    function clampToPlayfield(piece) {
      if (piece.isWall) return;
      if (piece.x < piece.radius) {
        piece.x = piece.radius;
        piece.vx = Math.abs(piece.vx) * 0.35;
      }
      if (piece.x > state.width - piece.radius) {
        piece.x = state.width - piece.radius;
        piece.vx = -Math.abs(piece.vx) * 0.35;
      }
      if (piece.y + piece.radius > floorY()) {
        piece.y = floorY() - piece.radius;
        piece.vy = 0;
        piece.vx *= 0.5;
        piece.spin *= 0.72;
      }
    }

    function resetGame() {
      playSound("start");
      const settings = difficultySettings[state.difficulty];
      state.demoPieces = [];
      state.pieces = [];
      state.wallPieces = [];
      state.particles = [];
      state.dragging = null;
      state.spawnTimer = 350;
      state.spawnEvery = settings.spawnEvery;
      state.survivalTime = 0;
      state.score = 0;
      state.chain = 0;
      state.chainTimer = 0;
      state.level = settings.initialLevel;
      updateDifficulty();
      state.running = true;
      state.paused = false;
      state.gameOver = false;
      state.cleared = false;
      state.clearPulse = 0;
      state.flash = 0;
      message.querySelector("h1").textContent = introTitle;
      message.querySelector("p").textContent = introText;
      startButton.textContent = "スタート";
      resultMeta.classList.add("hidden");
      resultMeta.textContent = "";
      sameRetryButton.classList.add("hidden");
      pauseButton.textContent = "Ⅱ";
      for (let i = 0; i < 9; i += 1) {
        state.pieces.push(createPiece(randomInt(50, state.width - 50), randomInt(-260, -20)));
      }
      updateHud();
      message.classList.add("hidden");
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      chainEl.textContent = `${Math.floor(wallProgress() * 100)}%`;
      levelEl.textContent = state.level;
    }

    function showResult(title, text) {
      message.querySelector("h1").textContent = title;
      message.querySelector("p").textContent = text;
      resultMeta.textContent = `${difficultySettings[state.difficulty].label} / SCORE ${state.score} / WALL ${Math.floor(wallProgress() * 100)}%`;
      resultMeta.classList.remove("hidden");
      startButton.textContent = "難易度を選び直して再挑戦";
      sameRetryButton.classList.remove("hidden");
      message.classList.remove("hidden");
    }

    function updateDifficultyButtons() {
      difficultyButtons.forEach((button) => {
        button.classList.toggle("selected", button.dataset.difficulty === state.difficulty);
      });
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function hitPiece(x, y) {
      for (let i = state.pieces.length - 1; i >= 0; i -= 1) {
        const piece = state.pieces[i];
        if (piece.isWall) continue;
        const dx = x - piece.x;
        const dy = y - piece.y;
        if (Math.hypot(dx, dy) <= piece.radius + 16) {
          return piece;
        }
      }
      return null;
    }

    function onPointerDown(event) {
      if (!state.running || state.paused || state.gameOver || state.cleared) return;
      const pos = pointerPosition(event);
      const piece = hitPiece(pos.x, pos.y);
      if (!piece) return;
      state.dragging = piece;
      state.dragOffsetX = piece.x - pos.x;
      state.dragOffsetY = piece.y - pos.y;
      piece.vx = 0;
      piece.vy = Math.max(10, piece.vy * 0.25);
      canvas.classList.add("dragging");
      canvas.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!state.dragging || state.dragging.isWall) return;
      const pos = pointerPosition(event);
      const piece = state.dragging;
      const targetX = pos.x + state.dragOffsetX;
      const targetY = pos.y + state.dragOffsetY;
      piece.x = Math.max(piece.radius, Math.min(state.width - piece.radius, targetX));
      piece.y = Math.max(piece.radius, Math.min(state.height - piece.radius, targetY));
      piece.vx = 0;
      piece.vy = 18;
    }

    function onPointerUp(event) {
      if (state.dragging) {
        if (!tryAttachToWall(state.dragging)) {
          state.dragging.vy = Math.max(34, 46 + state.level * 7);
        }
      }
      state.dragging = null;
      canvas.classList.remove("dragging");
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    function spawnBurst(piece) {
      const fill = colors[piece.lobes][0];
      for (let i = 0; i < 16; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 55 + Math.random() * 160;
        state.particles.push({
          x: piece.x,
          y: piece.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.46 + Math.random() * 0.28,
          age: 0,
          size: 3 + Math.random() * 5,
          fill
        });
      }
    }

    function expectedWallLobes() {
      if (!state.wallPieces.length) return null;
      return nextLobes(state.wallPieces[state.wallPieces.length - 1].lobes);
    }

    function oppositeRackSide(direction) {
      return direction > 0 ? "right" : "left";
    }

    function reachesOppositeRack(piece, target) {
      return target.direction > 0
        ? target.x + piece.radius >= state.width - 76
        : target.x - piece.radius <= 76;
    }

    function canCompleteOnOppositeRack(last, piece, rackTarget) {
      const distance = Math.hypot(last.x - rackTarget.x, last.y - rackTarget.y);
      return distance <= touchDistance(last, piece) + 8;
    }

    function nextWallTarget(piece) {
      if (!state.wallPieces.length) return null;
      const last = state.wallPieces[state.wallPieces.length - 1];
      const distance = touchDistance(last, piece) * 0.92;
      const target = {
        x: last.x + last.wallDirection * distance,
        y: wallY(),
        direction: last.wallDirection,
        complete: false
      };
      if (reachesOppositeRack(piece, target)) {
        const rackTarget = shelfTarget(oppositeRackSide(last.wallDirection), piece);
        if (canCompleteOnOppositeRack(last, piece, rackTarget)) {
          return {
            ...rackTarget,
            complete: true
          };
        }
      }
      return target;
    }

    function makeWallPiece(piece, target, isAnchor) {
      piece.isWall = true;
      piece.wallAnchor = isAnchor;
      piece.wallDirection = target.direction;
      piece.supported = false;
      piece.x = target.x;
      piece.y = target.y;
      piece.vx = 0;
      piece.vy = 0;
      piece.spin = 0;
      piece.angle = 0;
      state.wallPieces.push(piece);
      state.score += isAnchor ? 120 : 180;
      state.flash = 0.16;
      playSound(target.complete ? "clear" : "attach");
      updateHud();
      if (target.complete) {
        clearGame();
      }
    }

    function tryAttachToWall(piece) {
      if (!piece || piece.isWall) return false;
      if (!state.wallPieces.length) {
        const left = shelfTarget("left", piece);
        const right = shelfTarget("right", piece);
        const leftDistance = Math.hypot(piece.x - left.x, piece.y - left.y);
        const rightDistance = Math.hypot(piece.x - right.x, piece.y - right.y);
        const target = leftDistance <= rightDistance ? left : right;
        if (Math.min(leftDistance, rightDistance) <= piece.radius + 24) {
          makeWallPiece(piece, target, true);
          return true;
        }
        return false;
      }

      if (piece.lobes !== expectedWallLobes()) return false;
      const target = nextWallTarget(piece);
      if (Math.hypot(piece.x - target.x, piece.y - target.y) <= piece.radius + 24) {
        makeWallPiece(piece, target, false);
        return true;
      }
      return false;
    }

    function detachWallTailFromBreak(erasedWallPieces) {
      if (!erasedWallPieces.size) return;
      const breakIndex = state.wallPieces.findIndex((piece) => erasedWallPieces.has(piece.id));
      if (breakIndex < 0) return;

      const tail = state.wallPieces.slice(breakIndex + 1);
      for (const piece of tail) {
        piece.isWall = false;
        piece.wallAnchor = false;
        piece.wallDirection = 0;
        piece.supported = false;
        piece.supportedTime = 0;
        piece.vx = randomInt(-18, 18);
        piece.vy = 38 + state.level * 5;
        piece.spin = (Math.random() - 0.5) * 0.85;
      }
      if (tail.length) {
        playSound("break");
      }
      state.wallPieces = state.wallPieces.slice(0, breakIndex);
    }

    function handleWallContacts() {
      const erasedPieces = new Set();
      const erasedWallPieces = new Set();
      for (const piece of state.pieces) {
        if (piece.isWall || piece === state.dragging) continue;
        tryAttachToWall(piece);
      }

      for (const piece of state.pieces) {
        if (piece.isWall || piece === state.dragging) continue;
        for (const wall of state.wallPieces) {
          if (wall.wallAnchor || wall.lobes !== piece.lobes) continue;
          const distance = Math.hypot(piece.x - wall.x, piece.y - wall.y);
          if (distance <= touchDistance(piece, wall) + 10) {
            erasedPieces.add(piece.id);
            erasedWallPieces.add(wall.id);
            break;
          }
        }
      }

      if (!erasedPieces.size && !erasedWallPieces.size) return;
      const removed = state.pieces.filter((piece) => erasedPieces.has(piece.id) || erasedWallPieces.has(piece.id));
      removed.forEach(spawnBurst);
      if (erasedWallPieces.size) {
        playSound("break");
      } else {
        playSound("pop");
      }
      state.pieces = state.pieces.filter((piece) => !erasedPieces.has(piece.id) && !erasedWallPieces.has(piece.id));
      detachWallTailFromBreak(erasedWallPieces);
      state.score += erasedPieces.size * 30;
      state.flash = 0.16;
      updateHud();
    }

    function removeMatches() {
      const matched = new Set();
      for (let i = 0; i < state.pieces.length; i += 1) {
        const a = state.pieces[i];
        if (a.matched || a.isWall) continue;
        for (let j = i + 1; j < state.pieces.length; j += 1) {
          const b = state.pieces[j];
          if (b.matched || b.isWall || a.lobes !== b.lobes) continue;
          const distance = Math.hypot(a.x - b.x, a.y - b.y);
          if (distance <= touchDistance(a, b) + 16) {
            matched.add(a.id);
            matched.add(b.id);
            break;
          }
        }
      }

      if (!matched.size) {
        if (state.chainTimer <= 0 && state.chain !== 0) {
          state.chain = 0;
          updateHud();
        }
        return;
      }

      const removed = state.pieces.filter((piece) => matched.has(piece.id));
      removed.forEach(spawnBurst);
      playSound("pop");
      state.pieces = state.pieces.filter((piece) => !matched.has(piece.id));
      state.chain += 1;
      state.chainTimer = 1.4;
      state.score += removed.length * 50 * state.chain;
      updateDifficulty();
      state.flash = 0.16;
      updateHud();
    }

    function updateDifficulty() {
      const settings = difficultySettings[state.difficulty];
      if (settings.fixedLevel) {
        state.level = settings.fixedLevel;
        state.spawnEvery = settings.spawnEvery;
        return;
      }
      const scoreLevel = 1 + Math.floor(state.score / 900);
      const timeLevel = 1 + Math.floor(state.survivalTime / 18);
      state.level = Math.min(14, Math.max(settings.initialLevel, scoreLevel, timeLevel));
      state.spawnEvery = Math.max(280, settings.spawnEvery - state.level * 58);
    }

    function canMove(piece) {
      return piece !== state.dragging && !piece.isWall;
    }

    function isRestingOn(piece, base) {
      const dx = Math.abs(piece.x - base.x);
      const verticalGap = base.y - piece.y;
      const contact = touchDistance(piece, base);
      const horizontalOverlap = dx <= contact * 0.84;
      const aboveBase = verticalGap >= Math.min(piece.radius, base.radius) * 0.14;
      const closeEnough = Math.hypot(piece.x - base.x, piece.y - base.y) <= contact + 8;
      return horizontalOverlap && aboveBase && closeEnough;
    }

    function verticalDamping(piece, other) {
      const dx = Math.abs(piece.x - other.x);
      const contact = touchDistance(piece, other);
      const landingOnTop = piece.y < other.y && dx <= contact * 0.54;
      return landingOnTop ? 0.58 : 0.86;
    }

    function resolveCollisions() {
      for (let i = 0; i < state.pieces.length; i += 1) {
        const a = state.pieces[i];
        for (let j = i + 1; j < state.pieces.length; j += 1) {
          const b = state.pieces[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distance = Math.max(0.001, Math.hypot(dx, dy));
          const minDistance = touchDistance(a, b);
          if (distance < minDistance) {
            const aCanMove = canMove(a);
            const bCanMove = canMove(b);
            if (!aCanMove && !bCanMove) continue;
            const push = minDistance - distance;
            const nx = dx / distance;
            const ny = dy / distance;
            if (aCanMove) {
              a.x -= nx * (bCanMove ? push * 0.5 : push);
              a.y -= ny * (bCanMove ? push * 0.5 : push);
            }
            if (bCanMove) {
              b.x += nx * (aCanMove ? push * 0.5 : push);
              b.y += ny * (aCanMove ? push * 0.5 : push);
            }
            if (aCanMove) {
              a.vx *= 0.68;
              a.vy *= verticalDamping(a, b);
              a.spin *= 0.76;
            }
            if (bCanMove) {
              b.vx *= 0.68;
              b.vy *= verticalDamping(b, a);
              b.spin *= 0.76;
            }
          }
        }
      }
      for (const piece of state.pieces) {
        if (piece !== state.dragging) {
          clampToPlayfield(piece);
        }
      }
    }

    function markSupportedPile() {
      for (const piece of state.pieces) {
        piece.supported = !piece.isWall && piece.y + piece.radius >= floorY() - 6;
      }

      let changed = true;
      while (changed) {
        changed = false;
        for (const piece of state.pieces) {
          if (piece.supported) continue;
          for (const base of state.pieces) {
            if (piece.isWall || base.isWall || !base.supported || piece === base || piece.y >= base.y) continue;
            if (isRestingOn(piece, base)) {
              piece.supported = true;
              changed = true;
              break;
            }
          }
        }
      }
    }

    function updateSupportTimers(dt) {
      for (const piece of state.pieces) {
        if (piece.isWall) continue;
        if (piece.supported) {
          piece.supportedTime += dt;
        } else {
          piece.supportedTime = 0;
        }
      }
    }

    function pileHasCrossedDangerLine() {
      return state.pieces.some((piece) => (
        !piece.isWall &&
        piece.supported &&
        piece.supportedTime >= 0.36 &&
        piece.y - piece.radius <= dangerLineY()
      ));
    }

    function updateDemo(dt) {
      const shouldShowDemo = !state.running && !state.gameOver && !state.cleared && !message.classList.contains("hidden");
      if (!shouldShowDemo) return;

      state.demoSpawnTimer -= dt * 1000;
      if (state.demoSpawnTimer <= 0 && state.demoPieces.length < 22) {
        state.demoPieces.push(createDemoPiece());
        state.demoSpawnTimer = 360 + Math.random() * 260;
      }

      for (const piece of state.demoPieces) {
        piece.vy = Math.min(132, piece.vy + 185 * dt);
        piece.vx *= 0.997;
        piece.x += piece.vx * dt;
        piece.y += piece.vy * dt;
        piece.angle += piece.spin * dt;
        piece.wobble += dt * 2.2;
        if (piece.x < piece.radius || piece.x > state.width - piece.radius) {
          piece.vx *= -0.6;
          piece.x = Math.max(piece.radius, Math.min(state.width - piece.radius, piece.x));
        }
        if (piece.y + piece.radius > floorY()) {
          piece.y = floorY() - piece.radius;
          piece.vy = 0;
          piece.vx *= 0.55;
          piece.spin *= 0.74;
        }
      }

      resolveDemoCollisions();
      resolveDemoCollisions();
      removeDemoMatches();

      const pileTooHigh = state.demoPieces.some((piece) => piece.y - piece.radius <= dangerLineY() + 16);
      if (pileTooHigh || state.demoPieces.length > 26) {
        state.demoPieces.forEach(spawnBurst);
        state.demoPieces = [];
        state.demoSpawnTimer = 260;
      }
    }

    function resolveDemoCollisions() {
      for (let i = 0; i < state.demoPieces.length; i += 1) {
        const a = state.demoPieces[i];
        for (let j = i + 1; j < state.demoPieces.length; j += 1) {
          const b = state.demoPieces[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distance = Math.max(0.001, Math.hypot(dx, dy));
          const minDistance = touchDistance(a, b);
          if (distance < minDistance) {
            const push = (minDistance - distance) * 0.5;
            const nx = dx / distance;
            const ny = dy / distance;
            a.x -= nx * push;
            a.y -= ny * push;
            b.x += nx * push;
            b.y += ny * push;
            a.vx *= 0.72;
            b.vx *= 0.72;
            a.vy *= verticalDamping(a, b);
            b.vy *= verticalDamping(b, a);
          }
        }
      }

      for (const piece of state.demoPieces) {
        if (piece.x < piece.radius) piece.x = piece.radius;
        if (piece.x > state.width - piece.radius) piece.x = state.width - piece.radius;
        if (piece.y + piece.radius > floorY()) {
          piece.y = floorY() - piece.radius;
          piece.vy = 0;
        }
      }
    }

    function removeDemoMatches() {
      const matched = new Set();
      for (let i = 0; i < state.demoPieces.length; i += 1) {
        const a = state.demoPieces[i];
        for (let j = i + 1; j < state.demoPieces.length; j += 1) {
          const b = state.demoPieces[j];
          if (a.lobes !== b.lobes) continue;
          if (Math.hypot(a.x - b.x, a.y - b.y) <= touchDistance(a, b) + 14) {
            matched.add(a.id);
            matched.add(b.id);
            break;
          }
        }
      }
      if (!matched.size) return;
      const removed = state.demoPieces.filter((piece) => matched.has(piece.id));
      removed.forEach(spawnBurst);
      state.demoPieces = state.demoPieces.filter((piece) => !matched.has(piece.id));
    }

    function update(dt) {
      updateDemo(dt);
      if (state.cleared) {
        updateEffects(dt);
        return;
      }
      if (!state.running || state.paused || state.gameOver) {
        if (!state.paused && !state.gameOver) {
          updateEffects(dt);
        }
        return;
      }
      state.survivalTime += dt;
      updateDifficulty();
      state.spawnTimer -= dt * 1000;
      if (state.spawnTimer <= 0) {
        const settings = difficultySettings[state.difficulty];
        state.pieces.push(createPiece());
        if (state.level >= settings.doubleLevel && Math.random() < settings.doubleChance) {
          state.pieces.push(createPiece());
        }
        state.spawnTimer = state.spawnEvery;
      }

      for (const piece of state.pieces) {
        if (piece !== state.dragging && !piece.isWall) {
          piece.vy = Math.min(185 + state.level * 10, piece.vy + (210 + state.level * 16) * dt);
          piece.vx *= 0.996;
          piece.x += piece.vx * dt;
          piece.y += piece.vy * dt;
          piece.angle += piece.spin * dt;
          piece.wobble += dt * 3.4;
          clampToPlayfield(piece);
        }
      }

      handleWallContacts();
      if (state.cleared) {
        updateEffects(dt);
        return;
      }
      resolveCollisions();
      resolveCollisions();
      markSupportedPile();
      removeMatches();
      markSupportedPile();
      updateSupportTimers(dt);

      updateEffects(dt);

      if (pileHasCrossedDangerLine()) {
        endGame();
      }
    }

    function updateEffects(dt) {
      state.particles = state.particles.filter((particle) => {
        particle.age += dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vy += 220 * dt;
        return particle.age < particle.life;
      });

      state.flash = Math.max(0, state.flash - dt);
      state.chainTimer = Math.max(0, state.chainTimer - dt);
      state.clearPulse = Math.max(0, state.clearPulse - dt);
    }

    function endGame() {
      if (state.cleared) return;
      state.gameOver = true;
      state.running = false;
      state.dragging = null;
      canvas.classList.remove("dragging");
      playSound("gameover");
      showResult("ゲームオーバー", "下から積み上がった図形が防御ラインを超えました。ラインを突破されないよう、防御ラインの完成を急ぎましょう。");
    }

    function clearGame() {
      state.cleared = true;
      state.running = false;
      state.dragging = null;
      state.clearPulse = 1.35;
      for (const piece of state.wallPieces) {
        spawnBurst(piece);
      }
      canvas.classList.remove("dragging");
      showResult("ゲームクリア！", "防御ラインが反対側のラックまで完成しました。次は難易度を上げて、より早い完成を狙えます。");
    }

    function drawBackground() {
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      for (let x = 0; x < state.width; x += 42) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, state.height);
        ctx.stroke();
      }
      for (let y = 0; y < state.height; y += 42) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(state.width, y);
        ctx.stroke();
      }
      ctx.restore();

      const dangerY = dangerLineY();
      ctx.save();
      ctx.strokeStyle = state.flash > 0 ? "#ffffff" : "rgba(210, 91, 82, 0.72)";
      ctx.fillStyle = "rgba(210, 91, 82, 0.09)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 9]);
      ctx.beginPath();
      ctx.moveTo(0, dangerY);
      ctx.lineTo(state.width, dangerY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillRect(0, 0, state.width, dangerY);
      ctx.fillStyle = "rgba(37, 49, 61, 0.16)";
      ctx.fillRect(0, floorY(), state.width, state.height - floorY());
      ctx.fillStyle = "#d25b52";
      ctx.font = "800 13px ui-rounded, system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText("GAME OVER LINE", state.width - 14, dangerY - 7);
      ctx.restore();
      drawWallGuide();
    }

    function drawWallGuide() {
      const y = wallY();
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.strokeStyle = "rgba(37, 49, 61, 0.54)";
      ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
      ctx.lineWidth = 4;
      for (const side of ["left", "right"]) {
        const x = side === "left" ? 0 : state.width - 76;
        ctx.fillRect(x, y + 28, 76, 12);
        ctx.strokeRect(x, y + 28, 76, 12);
      }

      if (!state.wallPieces.length) {
        const dummy = { radius: 30 };
        for (const side of ["left", "right"]) {
          const target = shelfTarget(side, dummy);
          ctx.strokeStyle = "rgba(14, 143, 143, 0.8)";
          ctx.fillStyle = "rgba(14, 143, 143, 0.08)";
          ctx.lineWidth = 3;
          ctx.setLineDash([7, 8]);
          ctx.beginPath();
          ctx.arc(target.x, target.y, 35, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);
        }
      } else {
        const expected = expectedWallLobes();
        const dummy = { radius: pieceRadius(expected), lobes: expected };
        const target = nextWallTarget(dummy);
        if (target.x > 32 && target.x < state.width - 32) {
          ctx.strokeStyle = "rgba(229, 170, 38, 0.92)";
          ctx.fillStyle = "rgba(229, 170, 38, 0.13)";
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 7]);
          ctx.beginPath();
          ctx.arc(target.x, target.y, dummy.radius + 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#25313d";
          ctx.font = "900 15px ui-rounded, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`次 ${expected}`, target.x, target.y - dummy.radius - 18);
        }
      }

      ctx.restore();
    }

    function drawWallConnections() {
      if (!state.wallPieces.length) return;
      const first = state.wallPieces[0];
      const last = state.wallPieces[state.wallPieces.length - 1];
      const startX = first.wallDirection > 0 ? 0 : state.width;
      const progressX = Math.max(0, Math.min(state.width, last.x));
      const y = wallY();
      const bandWidth = Math.max(58, pieceRadius(10) * 2.35);
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(37, 49, 61, 0.12)";
      ctx.lineWidth = bandWidth;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(state.width, y);
      ctx.stroke();

      ctx.strokeStyle = "rgba(229, 170, 38, 0.5)";
      ctx.lineWidth = bandWidth;
      ctx.beginPath();
      ctx.moveTo(startX, y);
      ctx.lineTo(progressX, y);
      ctx.stroke();

      if (state.clearPulse > 0) {
        ctx.strokeStyle = `rgba(255, 246, 180, ${0.28 + state.clearPulse * 0.42})`;
        ctx.lineWidth = bandWidth + state.clearPulse * 22;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(state.width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = "rgba(255, 255, 255, 0.62)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(startX, y);
      ctx.lineTo(progressX, y);
      ctx.stroke();
      ctx.restore();
    }

    function drawPiece(piece) {
      const [fill, stroke] = colors[piece.lobes];
      const lobes = piece.lobes;
      const base = piece.radius * 0.62;
      const bump = piece.radius * 0.28;
      ctx.save();
      ctx.translate(piece.x, piece.y);
      ctx.rotate(piece.angle);
      ctx.shadowColor = piece.isWall ? "rgba(91, 73, 28, 0.28)" : "rgba(34, 47, 48, 0.22)";
      ctx.shadowBlur = piece === state.dragging ? 18 : piece.isWall ? 14 : 10;
      ctx.shadowOffsetY = piece === state.dragging ? 9 : 5;

      ctx.beginPath();
      for (let i = 0; i <= lobes * 2; i += 1) {
        const t = (i / (lobes * 2)) * Math.PI * 2;
        const r = i % 2 === 0 ? base + bump : base;
        const wobble = Math.sin(piece.wobble + i * 1.7) * 1.4;
        const x = Math.cos(t) * (r + wobble);
        const y = Math.sin(t) * (r + wobble);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const gradient = ctx.createLinearGradient(-piece.radius, -piece.radius, piece.radius, piece.radius);
      gradient.addColorStop(0, "#fff7d9");
      gradient.addColorStop(0.18, fill);
      gradient.addColorStop(1, stroke);
      ctx.fillStyle = gradient;
      ctx.strokeStyle = piece.isWall ? "#25313d" : "rgba(255, 255, 255, 0.78)";
      ctx.lineWidth = piece.isWall ? 4 : 3;
      ctx.fill();
      ctx.stroke();

      ctx.shadowColor = "transparent";
      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.beginPath();
      ctx.arc(-piece.radius * 0.18, -piece.radius * 0.2, piece.radius * 0.22, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(-piece.angle);
      ctx.fillStyle = "#24313b";
      ctx.font = `900 ${Math.max(16, piece.radius * 0.52)}px ui-rounded, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(piece.lobes, 0, 1);
      ctx.restore();
    }

    function drawParticles() {
      for (const particle of state.particles) {
        const life = 1 - particle.age / particle.life;
        ctx.save();
        ctx.globalAlpha = Math.max(0, life);
        ctx.fillStyle = particle.fill;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size * life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawPaused() {
      if (!state.paused) return;
      ctx.save();
      ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
      ctx.fillRect(0, 0, state.width, state.height);
      ctx.fillStyle = "#25313d";
      ctx.font = "900 34px ui-rounded, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("一時停止", state.width / 2, state.height / 2);
      ctx.restore();
    }

    function render() {
      drawBackground();
      if (!state.running && !state.gameOver && !state.cleared) {
        ctx.save();
        ctx.globalAlpha = 0.52;
        for (const piece of state.demoPieces) {
          drawPiece(piece);
        }
        ctx.restore();
      }
      drawWallConnections();
      for (const piece of state.pieces) {
        drawPiece(piece);
      }
      drawParticles();
      drawPaused();
    }

    function loop(time) {
      if (!state.lastTime) state.lastTime = time;
      const dt = Math.min(0.034, (time - state.lastTime) / 1000);
      state.lastTime = time;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    startButton.addEventListener("click", resetGame);
    sameRetryButton.addEventListener("click", resetGame);
    restartButton.addEventListener("click", resetGame);
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    document.addEventListener("touchstart", unlockAudio, { once: true });
    difficultyButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (state.running && !state.gameOver && !state.cleared) return;
        state.difficulty = button.dataset.difficulty;
        state.level = difficultySettings[state.difficulty].initialLevel;
        state.spawnEvery = difficultySettings[state.difficulty].spawnEvery;
        updateDifficultyButtons();
        updateHud();
      });
    });
    pauseButton.addEventListener("click", () => {
      if (!state.running || state.gameOver) return;
      state.paused = !state.paused;
      pauseButton.textContent = state.paused ? "▶" : "Ⅱ";
    });
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("resize", resize);

    resize();
    updateDifficultyButtons();
    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
